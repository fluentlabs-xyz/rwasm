[package]
name = "rwasm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1.4.2"
# Needed to map export names -> indices for snapshotting globals/tables/memory.
# Use the same version as `rwasm` itself to avoid version skew.
wasmparser = { version = "0.248.0", default-features = false, features = ["std", "features", "hash-collections"] }
wasmtime = { package = "wasmtime-rwasm", version = "45.0.0-rwasm.2" }
wasm-smith = { version = "0.259.0", features = ["wasmparser"] }
hex = "0.4.3"
log = "0.4.26"
env_logger = "0.11.8"
anyhow = "1.0"
rwasm = { path = "..", default-features = false, features = ["std", "fpu", "full-wasm-mode", "wasmtime"] }
rwasm-fuel-policy = { version = "0.0.2", default-features = false }
wat = "1.230.0"

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false

[[bin]]
name = "differential_imports"
path = "fuzz_targets/differential_imports.rs"
test = false
doc = false

[[bin]]
name = "resume_equivalence"
path = "fuzz_targets/resume_equivalence.rs"
test = false
doc = false

[[bin]]
name = "compile_malformed"
path = "fuzz_targets/compile_malformed.rs"
test = false
doc = false

[[bin]]
name = "repro_artifact"
path = "src/bin/repro_artifact.rs"
test = false
doc = false

[features]
default = ["disable-signals"]
# Disable signal-based traps in wasmtime to avoid conflicts with libfuzzer's
# signal handlers. This is needed on macOS where libfuzzer intercepts signals
# before wasmtime can handle them, causing false "deadly signal" crashes.
# Enabled by default on macOS.
disable-signals = []

[workspace]
