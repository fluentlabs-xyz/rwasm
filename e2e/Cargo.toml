[package]
name = "rwasm-e2e"
version = "0.1.0"
edition = "2021"

[dependencies]
rwasm = { path = "..", features = ["std", "fpu", "wasmtime", "e2e"], default-features = false }
anyhow = "1.0.71"
wast = "252.0.0"

[features]
default = ["rwasm/full-wasm-mode"]
debug-print = ["rwasm/debug-print"]
# Runs the rwasm side of the suite on memory leased from a `MemoryPool`, with every reset read
# back. This is rwasm's `memory-pool` feature, which also swaps the VM's memory type and write
# paths, so the suite then checks those against the spec as well.
memory-pool = ["rwasm/memory-pool"]
