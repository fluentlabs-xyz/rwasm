name: CI

on:
  push:
    branches: [ main, devel ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [ main, devel ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install clang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: |
          rustup target add wasm32-unknown-unknown
          rustup +nightly-2025-09-20 target add wasm32-unknown-unknown
          make test

      # The interpreter's bounds checks, the compiler's limits and the emitted bytecode all have
      # `#[cfg(debug_assertions)]`-dependent behaviour; the release profile is the one that ships,
      # so it is tested too (this suite is also what pins the release-mode traps that the debug
      # build would otherwise catch with an assertion).
      - name: Run tests (release)
        run: cargo test --release --no-fail-fast --manifest-path Cargo.toml
