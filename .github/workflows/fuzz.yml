name: Fuzz

on:
  push:
    branches: [ main, devel ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [ main, devel ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  differential:
    name: Differential fuzz (rwasm vs wasmtime)
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install clang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      # The differential target is the only check that compares the two engines on generated
      # input: return values, trap behaviour, store state and per-call fuel. It used to run only
      # by hand, so every divergence it covers shipped unnoticed.
      - name: Build the fuzz target
        run: cargo +nightly fuzz build differential
        working-directory: fuzz

      - name: Run a bounded differential session
        run: cargo +nightly fuzz run differential -- -max_total_time=600 -max_len=1048576 -rss_limit_mb=4096
        working-directory: fuzz
